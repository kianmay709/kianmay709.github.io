<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thanks | Stonevale Commerce</title>
  <meta name="description" content="Thanks for contacting Stonevale Commerce.">
  <link rel="icon" type="image/svg+xml" href="assets/stonevale-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-page{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:80px 0;background:var(--soft)}
    .thanks-card{max-width:760px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:56px;box-shadow:0 24px 70px rgba(0,0,0,.07)}
    .thanks-card img{width:58px;margin-bottom:28px}
    .thanks-card h1{font-size:clamp(46px,6vw,72px);margin-bottom:22px}
    .thanks-card p{font-size:18px;color:#5f5f5f;max-width:620px}
    .thanks-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    @media(max-width:620px){.thanks-card{padding:34px 24px}.thanks-page{padding:36px 0}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand header-brand" href="index.html" aria-label="Stonevale Commerce home">
      <img class="header-mark" src="assets/stonevale-mark.svg" alt="" aria-hidden="true">
      <span>Stonevale Commerce</span>
    </a>
  </div>
</header>
<main class="thanks-page">
  <div class="container">
    <section class="thanks-card">
      <img src="assets/stonevale-mark.svg" alt="Stonevale Commerce">
      <p class="eyebrow">Enquiry received</p>
      <h1>Thanks — we’ve got it.</h1>
      <p>Your Profit Leak Audit enquiry has been sent to Stonevale Commerce. We’ll review the details and get back to you shortly.</p>
      <div class="thanks-actions">
        <a class="button button-dark" href="index.html">Back to website</a>
        <a class="button button-text" href="sample-audit.html">View sample audit</a>
      </div>
    </section>
  </div>
</main>
</body>
</html>
